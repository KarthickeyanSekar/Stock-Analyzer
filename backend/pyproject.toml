[project]
name = "stock-analyzer"
version = "0.1.0"
description = "Stock Analyzer backend: FastAPI, Clean Architecture."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "apscheduler>=3.10,<4",
    "cryptography>=43",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    # ML engine (Phase 3, docs/26-ml-pipeline.md): numpy arrays, LightGBM models, isotonic calibration.
    # Data provider plugins (EODHD) call managed HTTP APIs.
    "httpx>=0.27",
    # pgvector column type for similar-setup search (screener analogs).
    "pgvector>=0.3",
    # OIDC sign-in: verify Google / Microsoft ID tokens (JWS + JWKS).
    "joserfc>=1.0",
    "numpy>=2.1",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D", "ANN", "S", "PL", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR2004"]
"**/__init__.py" = ["D104"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# No type stubs are published for these.
module = ["lightgbm.*", "sklearn.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.importlinter]
root_package = "stock_analyzer"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
    "stock_analyzer.presentation",
    "stock_analyzer.infrastructure",
    "stock_analyzer.application",
    "stock_analyzer.domain",
]
ignore_imports = []

[[tool.importlinter.contracts]]
name = "Domain is framework-free"
type = "forbidden"
source_modules = ["stock_analyzer.domain"]
forbidden_modules = [
    "fastapi", "sqlalchemy", "pydantic", "redis", "apscheduler", "opentelemetry",
    # ML libraries live in infrastructure/ml; domain maths stays pure Python.
    "numpy", "lightgbm", "sklearn",
]
