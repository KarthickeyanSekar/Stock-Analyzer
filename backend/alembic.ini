# Alembic configuration. The database URL comes from SA_DATABASE_URL (see migrations/env.py),
# never from this file. Run via the Makefile: make db-upgrade, make db-revision m="...".
[alembic]
script_location = src/stock_analyzer/infrastructure/persistence/migrations
prepend_sys_path = src
# Revision files: 0001_create_extensions.py, 0002_..., in order of creation.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
