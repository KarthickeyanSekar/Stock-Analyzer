repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c 'cd backend && .venv/bin/ruff check --fix . && .venv/bin/ruff format .'
        language: system
        files: ^backend/
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && .venv/bin/mypy src tests'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: import-linter
        name: import-linter
        entry: bash -c 'cd backend && .venv/bin/lint-imports'
        language: system
        files: ^backend/src/
        pass_filenames: false
      - id: frontend-lint
        name: eslint + prettier
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/
        pass_filenames: false
